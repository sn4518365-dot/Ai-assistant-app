<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #171717;
      border-bottom: 1px solid #333;
    }

    header h1 {
      color: #00d084;
      font-size: 24px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
    }

    .user {
      background: #075e54;
      margin-left: auto;
    }

    .bot {
      background: #242424;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 12px;
      background: #171717;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
      background: #292929;
      color: white;
    }

    button {
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      background: #00d084;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 My AI Assistant</h1>
  </header>

  <div id="chat">
    <div class="message bot">
      नमस्ते! 👋 मैं आपका AI Assistant हूँ। आप मुझसे कुछ भी पूछ सकते हैं।
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="कुछ लिखें..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >
    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();

      if (!message) return;

      const chat = document.getElementById("chat");

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;
      chat.appendChild(userMessage);

      input.value = "";

      setTimeout(() => {
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.textContent =
          "आपने पूछा: " + message +
          "\n\nAI जवाब देने के लिए अब हमें AI API जोड़नी होगी।";
        chat.appendChild(botMessage);

        chat.scrollTop = chat.scrollHeight;
      }, 500);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
